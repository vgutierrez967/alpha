<section class="search-section">
  {% if page.url == "/" %}
    <h1 class="search-title">Encuentra aquí definiciones, ejemplos y más</h1>
  {% endif %}

  <div class="search-wrapper" style="position:relative; max-width:500px; margin:0 auto;">
    <form class="search-form" action="{{ '/search/' | relative_url }}" method="get">
      <input type="text" id="search-input" name="q" placeholder="buscar lemas" autocomplete="off">
      <button type="submit" class="search-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" stroke="white" stroke-width="2" fill="none" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </form>

<!-- Suggestions dropdown -->
<ul id="search-suggestions" class="suggestions-list"
    style="position:absolute; top:100%; left:0; right:0;
           background:#fff; border:0px solid #ddd; border-radius:0 0 6px 6px;
           list-style:none; margin:0; padding:0; z-index:9999;">
</ul>

  </div>
</section>
