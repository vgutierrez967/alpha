---
layout: base
---

<main class="container">
  <article class="articulo-card">

    <header>
      <h1>{{ page.title }}</h1>
      <p class="meta">
        {{ page.date | date: "%d de %B de %Y" }}
        {% if page.author %} · {{ page.author }}{% endif %}
      </p>
    </header>

    {% if page.summary %}
      <p class="summary">{{ page.summary }}</p>
    {% endif %}

    <section class="content">
      {{ content }}
    </section>

  </article>
</main>
