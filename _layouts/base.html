<!-- Searchbar dropdown-->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const input = document.getElementById("search-input");
  const suggestions = document.getElementById("search-suggestions");
  if (!input || !suggestions) return;

  let index = [];

  // Load the JSON index (Liquid builds the correct path)
  fetch("{{ '/search.json' | relative_url }}")
    .then(res => {
      if (!res.ok) throw new Error("search.json not found: " + res.status);
      return res.json();
    })
    .then(data => { index = data; })
    .catch(err => {
      console.error("Failed to load search.json for suggestions:", err);
    });

  // helpers
  function hideSuggestions() {
    suggestions.style.display = "none";
    suggestions.innerHTML = "";
    selectedIndex = -1;
  }
  function showSuggestions() {
    suggestions.style.display = "block";
  }

  // Reset keyboard selection
  let selectedIndex = -1;

  input.addEventListener("input", function () {
    const q = this.value.trim().toLowerCase();
    suggestions.innerHTML = "";
    selectedIndex = -1;

    if (q.length < 2 || !index.length) {
      hideSuggestions();
      return;
    }

    // substring match on title only (case-insensitive)
    const matches = index.filter(item => item.title && item.title.toLowerCase().includes(q)).slice(0, 7);

    if (!matches.length) {
      hideSuggestions();
      return;
    }

    matches.forEach(item => {
      const li = document.createElement("li");
      li.className = "suggestion-item";
      // If you want latinismos italicized in the dropdown, uncomment next line:
      // const titleHTML = (item.collection === "latinismos") ? `<em>${escapeHtml(item.title)}</em>` : escapeHtml(item.title);
      const titleHTML = escapeHtml(item.title);
      li.innerHTML = `<a href="${item.url}">${titleHTML}</a>`;
      li.addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = item.url;
      });
      suggestions.appendChild(li);
    });

    showSuggestions();
  });

  // keyboard navigation (Up/Down/Enter/Escape)
  input.addEventListener("keydown", function (e) {
    const items = suggestions.querySelectorAll(".suggestion-item");
    if (!items.length) return;

    if (e.key === "ArrowDown") {
      e.preventDefault();
      selectedIndex = Math.min(selectedIndex + 1, items.length - 1);
      updateSelection(items);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      selectedIndex = Math.max(selectedIndex - 1, 0);
      updateSelection(items);
    } else if (e.key === "Enter") {
      // if a suggestion is selected, go to it
      if (selectedIndex >= 0 && items[selectedIndex]) {
        e.preventDefault();
        const a = items[selectedIndex].querySelector("a");
        if (a) window.location.href = a.href;
      }
      // otherwise let the form submit (redirect to /search/?q=...)
    } else if (e.key === "Escape") {
      hideSuggestions();
    }
  });

  function updateSelection(items) {
    items.forEach((it, i) => it.classList.toggle("active", i === selectedIndex));
    if (selectedIndex >= 0 && items[selectedIndex]) {
      items[selectedIndex].scrollIntoView({ block: "nearest", inline: "nearest" });
    }
  }

  // close when clicking outside the search wrapper
  document.addEventListener("click", (e) => {
    const wrapper = e.target.closest(".search-wrapper");
    if (!wrapper) hideSuggestions();
  });

  // small helper to avoid XSS when inserting plain titles
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
});
</script>

<script>
  function toggleDropdown(id) {
    const menu = document.getElementById(id);
    menu.classList.toggle("hidden");
  }

  // Mobile: toggle on click
  document.addEventListener("DOMContentLoaded", function () {
    const ramasLink = document.querySelector(".ramas-item > a");
    ramasLink.addEventListener("click", function (e) {
      if (window.innerWidth < 768) { // mobile breakpoint
        e.preventDefault();
        toggleDropdown("ramas-dropdown");
      }
    });
  });

  // Close dropdown if clicking outside
  document.addEventListener("click", function(event) {
    const dropdown = document.getElementById("ramas-dropdown");
    const ramasItem = document.querySelector(".ramas-item");
    if (!ramasItem.contains(event.target)) {
      dropdown.classList.add("hidden");
    }
  });
</script>

<script>
  const hamburger = document.querySelector(".menu-toggle");
  const mobileMenu = document.getElementById("mobileMenu");
  const closeMenu = document.getElementById("closeMenu");
  const overlay = document.querySelector(".mobile-overlay");

  function openMenu() {
    mobileMenu.classList.add("open");
    overlay.classList.add("active");
    document.body.classList.add("menu-open");
  }

  function closeMenuFn() {
    mobileMenu.classList.remove("open");
    overlay.classList.remove("active");
    document.body.classList.remove("menu-open");
  }

  if (hamburger) hamburger.addEventListener("click", openMenu);
  if (closeMenu) closeMenu.addEventListener("click", closeMenuFn);
  if (overlay) overlay.addEventListener("click", closeMenuFn);

  function toggleMobileDropdown(id) {
    const menu = document.getElementById(id);
    menu.classList.toggle("hidden");
  }
</script>
